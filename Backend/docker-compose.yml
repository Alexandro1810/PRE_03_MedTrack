services:

  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: medtrack_web

    # Port 8080 muss auch von den ESP32 im WLAN erreichbar sein
    ports:
      - "8080:80"

    environment:
      DB_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MEDTRACK_API_KEY: ${MEDTRACK_API_KEY}

    volumes:
      - ../Frontend:/var/www/html
      - ./php:/var/www/html/api

    depends_on:
      - db


  db:
    image: postgres:15

    container_name: medtrack_db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - medtrack_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql


volumes:
  medtrack_data:
